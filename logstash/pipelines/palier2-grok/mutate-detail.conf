input {
  exec {
    command => "echo 'Jul 21 08:15:33 rh8102 backup-job[1234]: Writing archive... 45GB written - Including: /etc,/home,/var'"
    interval => 5
  }
}

filter {
  grok {
       match => { "message" => "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{PROG:processus}(?:\[%{POSINT}\])?: %{GREEDYDATA:message_parse}" }
  }

  if [processus] == "backup-job" {
    grok {
       match => { "message_parse" => "Writing archive... %{NUMBER:[backup][size]}(?<[backup][unit]>[A-Za-z]+) written" }
    }

    mutate {
       gsub => [ "message_parse", "\n", "" ]
    }

    mutate {
       convert => { "[backup][size]" => "integer" }
       add_field => { "[backup][size_with_unit]" => "%{[backup][size]}%{[backup][unit]}" }
    }
    bytes {
       source =>  "[backup][size_with_unit]" 
       target =>  "[backup][bytes]" 
    }
    mutate {
       remove_field =>  [ "[backup][size_with_unit]" ]
    }

    grok {
       match => { "message_parse" => "%{DATA} Including: %{GREEDYDATA:[backup][directories]}" }
    }
    mutate {
       split => { "[backup][directories]" => "," }
    }

    mutate {
       add_field => { "[backup][excluded]" => "/sys,/dev" }
    }
    mutate {
       split => { "[backup][excluded]" => "," }
    }
    mutate {
      merge => { "[backup][directories]" => "[backup][excluded]" }
    }


  }
}

output {
  stdout {}
}
