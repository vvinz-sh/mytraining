[defaults]
inventory      = ./inventory.ini
host_key_checking = False
retry_files_enabled = False
callbacks_enabled = timer, profile_tasks, community.general.logstash

[callback_logstash]
server = rocky.localdomain
port = 5000
type = ansible

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False


