input {
  file {
    path => "/home/vinz/deployer_filebeat.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => multiline {
        pattern => "^(TASK|PLAY) \[|^PLAY RECAP"
        negate => true
        what => "previous"
        auto_flush_interval => 1
    }
  }
}

filter {
    #Gestion des lignes play
    if [message] =~ "^PLAY \[" {
        grok {
            match => { "message" => "%{WORD:[ansible][type]} \[%{DATA:[ansible][name]}\] \*%{GREEDYDATA}" }
        }
    }

    #Gestion des lignes task (message desormais fusionne sur 2 lignes physiques : entete + statut)
    else if [message] =~ "^TASK \[" {
        grok {
            match => { "message" => "%{WORD:[ansible][type]} \[%{DATA:[ansible][name]}\] \*%{DATA}\*\n%{WORD:[ansible][state]}: \[%{HOSTNAME:[ansible][target]}\]%{GREEDYDATA}" }
        }
    }

    #Gestion ligne recap (fusionnee avec son entete PLAY RECAP)
    else if [message] =~ ".*ok=.*changed=" {
        grok {
            match => { "message" => "%{DATA}\n%{HOSTNAME:[ansible][target]}%{SPACE}: %{GREEDYDATA:recap_line}" }
        }

#       kv cible un sous-chemin dedie ([ansible][counters]) plutot que [ansible]
#       directement, pour ne pas ecraser [ansible][target] deja peuple par le grok
#       ci-dessus (bug documente du filtre kv : target remplace tout le hash vise
#       au lieu d'y fusionner, si ce hash existe deja)
        kv {
          source => "recap_line"
          field_split => "\s+"
          value_split => "="
          target => "[ansible][counters]"
        }

        mutate {
            remove_field => "recap_line"
        }

        mutate {
            convert => { "[ansible][counters][ok]" => "integer" }
            convert => { "[ansible][counters][changed]" => "integer" }
            convert => { "[ansible][counters][unreachable]" => "integer" }
            convert => { "[ansible][counters][failed]" => "integer" }
            convert => { "[ansible][counters][skipped]" => "integer" }
            convert => { "[ansible][counters][rescued]" => "integer" }
            convert => { "[ansible][counters][ignored]" => "integer" }
        }
    }
}

output {
  if "_grokparsefailure" in [tags] {
    file {
      path => "/home/vinz/logstash-lab/failed_logs_ansible_v.log"
    }
  } else {
    file {
      path => "/home/vinz/logstash-lab/ok_logs_ansible_v.log"
    }
  }
}
